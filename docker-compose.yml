name: geopulse

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geopulse
      POSTGRES_PASSWORD: geopulse
      POSTGRES_DB: geopulse
    ports:
      - "5432:5432"
    volumes:
      - geopulse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopulse -d geopulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: geopulse
      RABBITMQ_DEFAULT_PASS: geopulse
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: production
    env_file:
      - .env
    environment: &backend_env
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://geopulse:geopulse@db:5432/geopulse
      CELERY_BROKER_URL: amqp://geopulse:geopulse@rabbitmq:5672//
      CELERY_RESULT_BACKEND: db+postgresql+psycopg2://geopulse:geopulse@db:5432/geopulse
      CORS_ORIGINS: http://localhost:3000,http://localhost,http://web
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: production
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    env_file:
      - .env
    environment:
      <<: *backend_env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      target: production
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    env_file:
      - .env
    environment:
      <<: *backend_env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ${FRONTEND_DIR:-../geopulse-frontend}
      target: production
      args:
        VITE_API_BASE: /api/v1
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  geopulse_pg:
