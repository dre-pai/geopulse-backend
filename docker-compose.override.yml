# Auto-loaded for local development: `docker compose up` / `./up.sh`
# Production ignores this file when compose files are listed explicitly.

services:
  api:
    build:
      context: .
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: &dev_backend_env
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg2://geopulse:geopulse@db:5432/geopulse
      CELERY_BROKER_URL: amqp://geopulse:geopulse@rabbitmq:5672//
      CELERY_RESULT_BACKEND: db+postgresql+psycopg2://geopulse:geopulse@db:5432/geopulse
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://web:5173
    volumes: !override
      - .:/app
    restart: "no"

  worker:
    build:
      context: .
      target: development
    environment:
      <<: *dev_backend_env
    volumes: !override
      - .:/app
    restart: "no"

  beat:
    build:
      context: .
      target: development
    environment:
      <<: *dev_backend_env
    volumes: !override
      - .:/app
    restart: "no"

  web:
    build:
      context: ${FRONTEND_DIR:-../geopulse-frontend}
      target: development
    environment: !override
      VITE_API_BASE: /api/v1
      VITE_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    ports: !override
      - "5173:5173"
    volumes: !override
      - ${FRONTEND_DIR:-../geopulse-frontend}:/app
      - web_node_modules:/app/node_modules
    restart: "no"

volumes:
  web_node_modules:
